<!doctype html>
<html lang="en-MU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Page not found — Kavish Tuitions</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#efebe3" />
    <script>
      // GitHub Pages serves this file for any unknown path, at any depth, so relative URLs can't be
      // trusted here. Work out the site root, then:
      //  1. send old-style paths like /<repo>/courses straight to the matching #/ route;
      //  2. otherwise load the fonts/favicon from the root and point the links at it.
      // On …github.io the first segment is the repository (a project site). On any other host the
      // site may sit at the root or under a sub-path: the first route name in the path marks where
      // the site ends, and failing that the site is found by looking for its data/content.json.
      (function () {
        var segs = location.pathname.split("/").filter(Boolean);
        var routes = ["courses", "tutors", "resources", "plans", "quiz", "enrol"];
        var gh = /\.github\.io$/i.test(location.hostname);
        var dec = function (s) {
          try { return decodeURIComponent(s); } catch (e) { return s; }
        };
        var prefix = function (n) {
          return "/" + segs.slice(0, n).join("/") + (n ? "/" : "");
        };
        if (segs.length && !/\.\w+$/.test(segs[segs.length - 1])) {
          for (var k = gh ? 1 : 0; k < segs.length; k++) {
            if (routes.indexOf(dec(segs[k]).toLowerCase()) > -1) {
              var route = segs.slice(k).map(function (s) { return encodeURIComponent(dec(s)); }).join("/");
              location.replace(prefix(k) + "#/" + route + location.search);
              return;
            }
          }
        }
        var head = function (b) {
          var icon = document.createElement("link");
          icon.rel = "icon";
          icon.type = "image/svg+xml";
          icon.href = b + "assets/img/favicon.svg";
          var fonts = document.createElement("link");
          fonts.rel = "stylesheet";
          fonts.href = b + "assets/css/fonts.css";
          document.head.appendChild(icon);
          document.head.appendChild(fonts);
        };
        window.__ktApplyBase = function (b) {
          window.__ktBase = b;
          var links = document.querySelectorAll("[data-base]");
          for (var i = 0; i < links.length; i++) links[i].setAttribute("href", b + (links[i].getAttribute("data-base") || ""));
        };
        var probing = !gh && segs.length > 1 && !!window.fetch;
        window.__ktBase = gh ? prefix(Math.min(1, segs.length)) : "/";
        if (!probing) return head(window.__ktBase);
        var n = 1; // shallowest first: /<sub-path>/ is the usual case
        (function probe() {
          if (n >= segs.length) return head(window.__ktBase);
          var candidate = prefix(n++);
          fetch(candidate + "data/content.json", { method: "HEAD", cache: "no-store" })
            .then(function (r) {
              if (!r.ok) return probe();
              window.__ktApplyBase(candidate);
              head(candidate);
            })
            .catch(probe);
        })();
      })();
    </script>
